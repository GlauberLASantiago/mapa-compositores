<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa da Música Clássica para Crianças</title>
    
    <!-- Favicon Personalizado (Nota Musical) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">

    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Poppins (fonte amigável e arredondada) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0fdf4; /* Verde bem clarinho */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            /* Usa 100dvh para lidar melhor com barras de navegação em celulares */
            height: 100dvh; 
            min-height: 100vh;
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 1;
        }

        /* Customização dos Popups do Leaflet para ficar mais infantil */
        .leaflet-popup-content-wrapper {
            border-radius: 1rem;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 280px !important;
        }
        .leaflet-popup-tip-container {
            display: none; /* Esconder a setinha padrão para um visual mais limpo */
        }
        
        /* Ícones customizados do mapa */
        .custom-div-icon {
            background: none;
            border: none;
        }
        .emoji-marker {
            font-size: 2.5rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .emoji-marker:hover {
            transform: scale(1.3) rotate(-10deg);
        }

        .bounce-animation {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
    </style>
    <meta property="og:image" content="https://glauberlasantiago.github.io/mapa-compositores/capa-compartilhamento.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="🌍 Viagem Musical 🎵">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body class="p-2 md:p-6 flex flex-col">

    <!-- Cabeçalho -->
    <header class="text-center mb-2 md:mb-6">
        <h1 class="text-2xl md:text-5xl font-extrabold text-indigo-700 drop-shadow-sm mb-1 md:mb-2">
            🌍 Viagem Musical 🎵
        </h1>
        <p class="text-xs md:text-xl text-emerald-700 font-semibold max-w-2xl mx-auto bg-emerald-100 rounded-full py-1 px-3 md:py-2 md:px-4 shadow-sm">
            Clique nos ícones para descobrir os gênios da música! 🕵️‍♂️✨
        </p>
    </header>

    <!-- Container do Mapa -->
    <main class="flex-grow relative rounded-xl md:rounded-2xl border-4 border-indigo-200 overflow-hidden bg-white shadow-inner" style="min-height: 50vh;">
        <div id="map" class="absolute inset-0"></div>
    </main>

    <!-- Rodapé -->
    <footer class="mt-2 md:mt-4 mb-1 text-center text-gray-500 text-xs md:text-sm font-medium">
        Feito com ❤️ para jovens exploradores musicais!
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // Inicializando o Mapa
        // Definimos o centro no Oceano Atlântico para mostrar Europa e Brasil juntos
        const map = L.map('map').setView([20, -10], 3);

        // Usando um mapa base bem colorido e limpo (CartoDB Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 10,
            minZoom: 2
        }).addTo(map);

        // Banco de Dados dos Compositores (Conteúdo focado para 12 anos)
        const compositores = [
            { 
                nome: "Wolfgang Amadeus Mozart", 
                lat: 47.8095, lng: 13.0436, 
                emoji: "🎹", 
                titulo: "O Menino Prodígio", 
                pais: "Áustria 🇦🇹",
                fato: "Começou a tocar piano aos 3 anos e a compor aos 5! Era super brincalhão e adorava contar piadas.", 
                musica: "A Flauta Mágica", 
                cor: "bg-blue-100", corBorda: "border-blue-400", corTexto: "text-blue-800"
            },
            { 
                nome: "Ludwig van Beethoven", 
                lat: 50.7374, lng: 7.0982, 
                emoji: "🎼", 
                titulo: "O Gênio Surdo", 
                pais: "Alemanha 🇩🇪",
                fato: "Ele continuou compondo músicas incríveis e gigantescas mesmo depois de ficar completamente surdo. Ele sentia a vibração do piano!", 
                musica: "Sinfonia Nº 5 (Ta-ta-ta-TÁ!)", 
                cor: "bg-red-100", corBorda: "border-red-400", corTexto: "text-red-800"
            },
            { 
                nome: "Johann Sebastian Bach", 
                lat: 50.9787, lng: 10.3238, 
                emoji: "⛪", 
                titulo: "O Mestre dos Teclados", 
                pais: "Alemanha 🇩🇪",
                fato: "Ele teve 20 filhos! Imagina o barulho e a quantidade de música que tinha na casa dele todo dia?", 
                musica: "Tocata e Fuga em Ré Menor", 
                cor: "bg-yellow-100", corBorda: "border-yellow-500", corTexto: "text-yellow-900"
            },
            { 
                nome: "Pyotr Ilyich Tchaikovsky", 
                lat: 57.0409, lng: 53.9806, 
                emoji: "🦢", 
                titulo: "O Rei das Histórias de Fantasia", 
                pais: "Rússia 🇷🇺",
                fato: "Sabe aquelas músicas famosas de Natal do Quebra-Nozes? Foi ele quem fez! E também a música do Cisne Branco.", 
                musica: "O Lago dos Cisnes", 
                cor: "bg-purple-100", corBorda: "border-purple-400", corTexto: "text-purple-800"
            },
            { 
                nome: "Antonio Vivaldi", 
                lat: 45.4408, lng: 12.3155, 
                emoji: "🎻", 
                titulo: "O Padre Ruivo", 
                pais: "Itália 🇮🇹",
                fato: "Ele tinha os cabelos bem vermelhos! Ele dava aulas de música em um orfanato só para meninas, e elas formavam uma orquestra incrível.", 
                musica: "As Quatro Estações", 
                cor: "bg-emerald-100", corBorda: "border-emerald-400", corTexto: "text-emerald-800"
            },
            { 
                nome: "Heitor Villa-Lobos", 
                lat: -22.9068, lng: -43.1729, 
                emoji: "🚂", 
                titulo: "O Herói Brasileiro", 
                pais: "Brasil 🇧🇷",
                fato: "Ele viajou pelas florestas do Brasil para escutar os pássaros e os índios, e misturou tudo isso com música clássica!", 
                musica: "O Trenzinho do Caipira", 
                cor: "bg-orange-100", corBorda: "border-orange-400", corTexto: "text-orange-900"
            },
            { 
                nome: "Frédéric Chopin", 
                lat: 52.2581, lng: 20.3235, 
                emoji: "🎹", 
                titulo: "O Poeta do Piano", 
                pais: "Polônia 🇵🇱",
                fato: "Ele odiava dar grandes shows, preferia tocar para pequenos grupos de amigos. Suas músicas são super românticas e muito difíceis!", 
                musica: "Valsa do Minuto", 
                cor: "bg-pink-100", corBorda: "border-pink-400", corTexto: "text-pink-800"
            }
        ];

        // Array para guardar as coordenadas e ajustar o zoom da tela
        const bounds = [];

        // Adicionando os compositores no mapa
        compositores.forEach(comp => {
            // Criando o ícone de Emoji Customizado
            const iconeEmoji = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="emoji-marker bounce-animation" title="${comp.nome}">${comp.emoji}</div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20], // Ponto de ancoragem no centro
                popupAnchor: [0, -20] // Onde o popup vai abrir
            });

            // Criando o HTML do Popup usando Tailwind CSS
            const conteudoPopup = `
                <div class="border-t-8 ${comp.corBorda} bg-white h-full w-full">
                    <div class="${comp.cor} p-4 text-center">
                        <div class="text-4xl mb-2">${comp.emoji}</div>
                        <h2 class="text-xl font-extrabold text-gray-800">${comp.nome}</h2>
                        <span class="inline-block bg-white/60 px-3 py-1 rounded-full text-sm font-bold mt-2 ${comp.corTexto}">
                            ${comp.titulo}
                        </span>
                    </div>
                    <div class="p-4 bg-white">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Local de Nascimento</p>
                        <p class="text-sm font-semibold mb-3">📍 ${comp.pais}</p>
                        
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Fato Curioso 🤔</p>
                        <p class="text-sm text-gray-700 mb-3 leading-relaxed">${comp.fato}</p>
                        
                        <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Peça Famosa 🎧</p>
                            <p class="text-sm font-bold text-indigo-600">${comp.musica}</p>
                        </div>
                    </div>
                </div>
            `;

            // Adicionando o Marcador no mapa
            const marcador = L.marker([comp.lat, comp.lng], { icon: iconeEmoji })
                .addTo(map)
                .bindPopup(conteudoPopup);

            bounds.push([comp.lat, comp.lng]);
        });

        // Ajustar o mapa para garantir que todos os marcadores sejam vistos
        // Padding reduzido para aproveitar melhor o espaço estreito das telas de celular
        map.fitBounds(bounds, { padding: [20, 20] });

    </script>
</body>
</html>
